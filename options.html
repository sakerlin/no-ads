<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>no ads – Options</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        margin: 0;
        padding: 18px;
        max-width: 900px;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 12px;
      }
      .muted {
        opacity: 0.7;
      }
      code {
        background: #f2f2f2;
        padding: 2px 6px;
        border-radius: 4px;
      }
      pre {
        background: #f7f7f7;
        padding: 10px;
        border-radius: 6px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>no ads – Options</h1>
    <p class="muted">Add extra CSS selectors (one per line). Lines starting with <code>#</code> are comments.</p>

    <h2>Custom selectors</h2>
    <textarea id="custom"></textarea>

    <div class="row" style="margin-top: 10px">
      <button id="save">Save</button>
      <button id="reset">Reset</button>
      <span id="status" class="muted"></span>
    </div>

    <h2>Tips</h2>
    <pre>
# Example selectors
# Hide a specific ad container
.div-ad
# Hide iframes from a known ad provider
iframe[src*="doubleclick.net"]
</pre>

    <script type="module" src="options.js"></script>
  </body>
</html>
